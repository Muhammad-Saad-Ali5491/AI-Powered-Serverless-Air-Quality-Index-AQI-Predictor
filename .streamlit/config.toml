# Streamlit configuration.
#
# Streamlit Community Cloud reads this automatically. Most server settings
# (port, headless mode, CORS) are managed by Streamlit Cloud itself and can
# be left out; this file only sets cosmetic/theme options plus a couple of
# safe defaults for running the same app locally on Windows/macOS/Linux.

[theme]
base = "light"
primaryColor = "#ff7e00"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f5"
textColor = "#262730"

[server]
runOnSave = true
# fileWatcherType left at default; Streamlit Cloud overrides server settings
# it needs to (address/port) regardless of what's set here.

[browser]
gatherUsageStats = false
