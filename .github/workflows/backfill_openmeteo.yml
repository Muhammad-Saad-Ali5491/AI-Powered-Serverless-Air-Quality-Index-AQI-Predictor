name: Backfill historical data (Open-Meteo)

on:
  workflow_dispatch:   # manual only - this is a one-time / occasional job, not recurring

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # historical pulls for 7 cities x 4 years can take a while
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python backfill_openmeteo.py
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
