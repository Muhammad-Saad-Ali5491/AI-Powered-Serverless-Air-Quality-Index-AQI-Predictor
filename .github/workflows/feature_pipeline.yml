name: Hourly Feature Pipeline

on:
  schedule:
    # Runs at minute 0 of every hour (UTC)
    - cron: "0 * * * *"
  workflow_dispatch: {}   # allow manual trigger from the Actions tab

permissions:
  contents: write

concurrency:
  group: feature-pipeline
  cancel-in-progress: false

jobs:
  fetch-features:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run hourly feature pipeline
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          USE_HOPSWORKS: ${{ vars.USE_HOPSWORKS || 'false' }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ vars.HOPSWORKS_PROJECT_NAME }}
          HOPSWORKS_HOST: ${{ vars.HOPSWORKS_HOST }}
        run: python scripts/run_feature_pipeline.py

      - name: Commit updated feature store
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions[bot]"
          git add data/features/*.parquet logs/*.log 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: hourly feature update [skip ci]"
          git push
